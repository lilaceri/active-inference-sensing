[project]
name = "aisense"
version = "0.1.0"
description = "Active inference for multi-sensor active sensing, implemented from scratch in NumPy."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
tests = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
typing = [
    "mypy>=1.10",
]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=aisense --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "D", "RUF"]
# N802/N803/N806/N815: names follow the model notation (A, B, C, D, G, E) as AGENTS.md requires.
ignore = ["D105", "D107", "N802", "N803", "N806", "N815"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"experiments/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
